name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_versions.py "${GITHUB_REF_NAME}"

  binaries:
    needs: verify
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, exe: tinymem }
          - { os: macos-latest, name: macos-arm64, exe: tinymem }
          - { os: windows-latest, name: windows-x86_64, exe: tinymem.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path rust/Cargo.toml
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp "rust/target/release/${{ matrix.exe }}" LICENSE README.md dist/
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "tinymem-${GITHUB_REF_NAME}-${{ matrix.name }}.zip" ./dist/*
          else
            tar -czf "tinymem-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" -C dist .
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: tinymem-*.*
          generate_release_notes: true

  pypi:
    # Off until a PyPI Trusted Publisher is configured: set the repository variable PUBLISH_PYPI to "true".
    if: vars.PUBLISH_PYPI == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC), no stored API token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
