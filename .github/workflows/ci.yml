name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_versions.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: clippy
        shell: bash
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings > out.txt 2>&1 || { rc=$?; head -c 1500 out.txt | tr '\n' '|' | sed 's/^/::error::/'; echo; exit $rc; }

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install numpy pypdf
      - run: python -m unittest discover -s python/tests -v

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: test
        shell: bash
        run: |
          cargo test --manifest-path rust/Cargo.toml > out.txt 2>&1 || { rc=$?; grep -E "panicked|FAILED|failed|error|left|right|assert" out.txt | head -c 1500 | tr '\n' '|' | sed 's/^/::error::/'; echo; exit $rc; }
      - run: cargo build --release --manifest-path rust/Cargo.toml
        if: matrix.os == 'ubuntu-latest'
      - run: scripts/crosscheck.sh rust/target/release/tinymem
        if: matrix.os == 'ubuntu-latest'
